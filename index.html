<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <title>Miami</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header class="header">
      <nav class="navigation">
        <div class="navigation__img-wrapper">
          <img
            src="./src/images/icons/brand-name.png"
            alt="Brand name as logo"
          />
        </div>
        <div class="navigation__content-wrapper">
          <a
            href="/"
            class="navigation__call"
          >
            <img
              src="./src/images/icons/Phone-number.png"
              class="navigation__call-img"
              alt="Call us"
            />
          </a>
          <a
            href="/"
            class="navigation__menu"
          >
            <img
              src="./src/images/icons/Icon-Burger-menu.png"
              class="navigation__burger-img"
              alt="Call us"
            />
          </a>
        </div>
      </nav>
      <h1 class="title header__title">
        Your senses.
        <br />
        Set free.
      </h1>
    </header>
  </body>
</html>
